<!DOCTYPE html>
<html>
<head>
  <style>
    .block {
      display: inline-block;
      padding: 8px 16px;
      color: #fff;
      background-color: #000;
    }

    .block__element {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <button class="block">Click me</button>
</body>
</html>
