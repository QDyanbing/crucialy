<!-- basic-invalid.html - HTML 中的样式无效示例（应触发错误） -->

<!DOCTYPE html>
<html>
<head>
  <style>
    .Button {
      colr: red; /* 拼写错误 -> 应触发 property-no-unknown */
      unknown-prop: 1; /* 未知属性 -> 应触发 property-no-unknown */
    }
  </style>
</head>
<body>
  <button class="Button">Bad</button>
</body>
</html>
